name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    env:
      # Safe placeholders: CI never talks to Supabase, Stream or Resend.
      NODE_ENV: test
      VITE_API_URL: http://localhost:3000
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Lint
        run: corepack pnpm lint

      - name: Test
        run: corepack pnpm test

      - name: Build
        run: corepack pnpm build

      - name: Audit production dependencies
        run: corepack pnpm audit --prod --audit-level high

      # `pnpm format:check` is not enforced yet: the working tree still has
      # unformatted files, so adding the step here would fail every run for
      # reasons unrelated to the change. Format the tree first, then add it.
